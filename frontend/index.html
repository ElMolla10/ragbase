<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAGBase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            surface: '#0c0c0e',
            card: '#141416',
            border: '#27272a',
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .scrollbar-thin::-webkit-scrollbar { width: 6px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
    .msg-user { background: linear-gradient(180deg, #1e1b4b 0%, #141416 100%); }
    #sidebar { transition: width 0.2s ease, transform 0.2s ease; }
    #sidebar.collapsed { width: 0; padding: 0; border: none; overflow: hidden; }
    .msg-content p { margin: 0 0 0.6rem; }
    .msg-content p:last-child { margin-bottom: 0; }
    .msg-content ul, .msg-content ol { margin: 0.4rem 0 0.6rem 1.1rem; }
    .msg-content li { margin: 0.25rem 0; }
    .msg-content strong { color: #e4e4e7; font-weight: 600; }
  </style>
</head>
<body class="bg-surface text-zinc-100 min-h-screen">
  <div class="flex h-screen">
    <aside id="sidebar" class="w-64 border-r border-border bg-card flex flex-col p-5 shrink-0">
      <div class="flex items-center justify-between mb-6">
        <div>
          <h1 class="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-violet-400 bg-clip-text text-transparent">RAGBase</h1>
          <p class="text-xs text-zinc-500 mt-1">Research paper Q&A</p>
        </div>
        <button id="close-sidebar" class="text-zinc-500 hover:text-zinc-300 p-1 rounded" title="Close sidebar">✕</button>
      </div>

      <nav class="space-y-1 mb-8">
        <button id="nav-chat" class="nav-btn w-full text-left px-3 py-2 rounded-lg text-sm font-medium bg-zinc-800 text-white">Chat</button>
        <button id="nav-docs" class="nav-btn w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-zinc-400 hover:bg-zinc-800/60">Documents</button>
      </nav>

      <div class="mt-auto space-y-3 text-xs">
        <div class="bg-zinc-900/80 rounded-xl p-3 border border-border">
          <div class="text-zinc-500 uppercase tracking-wider text-[10px]">Queries</div>
          <div id="stat-queries" class="text-lg font-semibold text-indigo-300">—</div>
        </div>
        <div class="bg-zinc-900/80 rounded-xl p-3 border border-border">
          <div class="text-zinc-500 uppercase tracking-wider text-[10px]">Avg latency</div>
          <div id="stat-latency" class="text-lg font-semibold text-indigo-300">—</div>
        </div>
        <div class="bg-zinc-900/80 rounded-xl p-3 border border-border">
          <div class="text-zinc-500 uppercase tracking-wider text-[10px]">Documents</div>
          <div id="stat-docs" class="text-lg font-semibold text-indigo-300">—</div>
        </div>
        <button id="reset-stats" class="w-full text-left text-[11px] text-zinc-500 hover:text-zinc-300 px-1">
          Reset query stats
        </button>
      </div>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 min-h-0">
      <button id="open-sidebar" class="hidden absolute top-3 left-3 z-10 bg-zinc-800 border border-border text-zinc-300 hover:text-white px-2.5 py-1.5 rounded-lg text-sm">
        ☰
      </button>

      <div id="view-chat" class="flex-1 flex flex-col min-h-0">
        <div class="border-b border-border px-6 py-4 flex items-center justify-between shrink-0">
          <div>
            <h2 class="font-semibold">Ask your papers</h2>
            <p class="text-xs text-zinc-500">English, Arabic, or mixed · cited answers</p>
          </div>
          <select id="doc-select" class="bg-zinc-900 border border-border rounded-lg px-3 py-1.5 text-sm text-zinc-300">
            <option value="">All papers</option>
          </select>
        </div>

        <div id="messages" class="flex-1 min-h-0 overflow-y-auto px-6 py-4 space-y-4 scrollbar-thin">
          <div id="empty-state" class="text-center text-zinc-500 text-sm mt-20">
            Upload a paper, then ask anything.<br/>Answers include page citations.
          </div>
        </div>

        <div class="border-t border-border p-4 shrink-0">
          <form id="chat-form" class="flex gap-2 max-w-3xl mx-auto">
            <input id="chat-input" type="text" placeholder="Ask a question…"
              class="flex-1 bg-zinc-900 border border-border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500" />
            <button type="submit" class="bg-indigo-500 hover:bg-indigo-600 text-white px-5 rounded-xl text-sm font-medium">Send</button>
          </form>
        </div>
      </div>

      <div id="view-docs" class="flex-1 hidden flex-col">
        <div class="border-b border-border px-6 py-4">
          <h2 class="font-semibold">Library</h2>
          <p class="text-xs text-zinc-500">Upload PDFs to index them</p>
        </div>
        <div class="p-6 max-w-2xl">
          <div class="border-2 border-dashed border-border rounded-2xl p-8 text-center mb-6">
            <input type="file" id="file-input" accept=".pdf" class="hidden" />
            <button id="upload-btn" class="bg-indigo-500 hover:bg-indigo-600 text-white px-5 py-2.5 rounded-xl text-sm font-medium">
              Upload PDF
            </button>
            <p id="upload-hint" class="text-xs text-zinc-500 mt-3">Any PDF with selectable text</p>
          </div>
          <div id="doc-list" class="space-y-2"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const BACKEND = "__BACKEND_URL__";
    const history = [];

    const sidebar = document.getElementById('sidebar');
    const openBtn = document.getElementById('open-sidebar');
    const closeBtn = document.getElementById('close-sidebar');

    function setSidebar(open) {
      sidebar.classList.toggle('collapsed', !open);
      openBtn.classList.toggle('hidden', open);
    }
    closeBtn.onclick = () => setSidebar(false);
    openBtn.onclick = () => setSidebar(true);

    const navChat = document.getElementById('nav-chat');
    const navDocs = document.getElementById('nav-docs');
    const viewChat = document.getElementById('view-chat');
    const viewDocs = document.getElementById('view-docs');

    function show(view) {
      viewChat.classList.toggle('hidden', view !== 'chat');
      viewChat.classList.toggle('flex', view === 'chat');
      viewDocs.classList.toggle('hidden', view !== 'docs');
      viewDocs.classList.toggle('flex', view === 'docs');
      navChat.classList.toggle('bg-zinc-800', view === 'chat');
      navChat.classList.toggle('text-white', view === 'chat');
      navChat.classList.toggle('text-zinc-400', view !== 'chat');
      navDocs.classList.toggle('bg-zinc-800', view === 'docs');
      navDocs.classList.toggle('text-white', view === 'docs');
      navDocs.classList.toggle('text-zinc-400', view !== 'docs');
    }
    navChat.onclick = () => show('chat');
    navDocs.onclick = () => { show('docs'); loadDocs(); };

    async function loadStats() {
      try {
        const r = await fetch(BACKEND + '/stats');
        const s = await r.json();
        document.getElementById('stat-queries').textContent = s.total_queries;
        document.getElementById('stat-latency').textContent = Math.round(s.avg_latency_ms) + ' ms';
        document.getElementById('stat-docs').textContent = s.total_documents;
      } catch (e) {}
    }
    loadStats();
    setInterval(loadStats, 15000);

    document.getElementById('reset-stats').onclick = async () => {
      if (!confirm('Clear query count and average latency?')) return;
      await fetch(BACKEND + '/stats', { method: 'DELETE' });
      loadStats();
    };

    async function loadDocs() {
      const sel = document.getElementById('doc-select');
      const list = document.getElementById('doc-list');
      try {
        const r = await fetch(BACKEND + '/documents');
        const docs = await r.json();
        sel.innerHTML = '<option value="">All papers</option>' +
          docs.map(d => `<option value="${d.id}">${d.filename}</option>`).join('');
        list.innerHTML = docs.length ? docs.map(d => `
          <div class="flex items-center justify-between bg-card border border-border rounded-xl px-4 py-3">
            <div>
              <div class="font-medium text-sm">${d.filename}</div>
              <div class="text-xs text-zinc-500">${d.num_chunks} chunks · ${d.status}</div>
            </div>
            <button onclick="deleteDoc(${d.id})" class="text-xs text-zinc-500 hover:text-red-400">Delete</button>
          </div>
        `).join('') : '<p class="text-sm text-zinc-500">No papers yet.</p>';
      } catch (e) {
        list.innerHTML = '<p class="text-sm text-red-400">Could not load documents</p>';
      }
    }

    window.deleteDoc = async (id) => {
      if (!confirm('Delete this document?')) return;
      await fetch(BACKEND + '/documents/' + id, { method: 'DELETE' });
      loadDocs();
      loadStats();
    };

    document.getElementById('upload-btn').onclick = () => document.getElementById('file-input').click();
    document.getElementById('file-input').onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const fd = new FormData();
      fd.append('file', file);
      const btn = document.getElementById('upload-btn');
      const hint = document.getElementById('upload-hint');
      btn.textContent = 'Indexing…';
      btn.disabled = true;
      hint.className = 'text-xs text-zinc-500 mt-3';
      hint.textContent = 'Any PDF with selectable text';
      try {
        const r = await fetch(BACKEND + '/ingest', { method: 'POST', body: fd });
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          hint.className = 'text-xs text-red-400 mt-3';
          hint.textContent = err.detail || 'Upload failed';
        } else {
          hint.className = 'text-xs text-emerald-400 mt-3';
          hint.textContent = 'Uploaded and indexed';
          loadDocs();
          loadStats();
        }
      } catch (err) {
        hint.className = 'text-xs text-red-400 mt-3';
        hint.textContent = 'Upload failed. Check the connection and try again.';
      }
      btn.textContent = 'Upload PDF';
      btn.disabled = false;
      e.target.value = '';
    };

    const messagesEl = document.getElementById('messages');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('chat-input');

    let pinnedToBottom = true;
    function isNearBottom() {
      return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 80;
    }
    messagesEl.addEventListener('scroll', () => {
      pinnedToBottom = isNearBottom();
    });

    function stickToBottom(force) {
      if (force || pinnedToBottom) {
        messagesEl.scrollTop = messagesEl.scrollHeight;
        pinnedToBottom = true;
      }
    }

    function hideEmpty() {
      const empty = document.getElementById('empty-state');
      if (empty) empty.remove();
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function renderMarkdown(text) {
      if (!text) return '';
      if (window.marked) {
        return marked.parse(text, { breaks: true, gfm: true });
      }
      return escapeHtml(text).replace(/\n/g, '<br>');
    }

    function prioritizeSources(sources, answer) {
      const pages = [];
      const re = /page\s+(\d+)/gi;
      let match;
      while ((match = re.exec(answer || '')) !== null) {
        const page = Number(match[1]);
        if (!pages.includes(page)) pages.push(page);
      }
      if (!pages.length) return sources;
      const cited = [];
      const rest = [];
      sources.forEach(s => {
        (pages.includes(Number(s.page_number)) ? cited : rest).push(s);
      });
      cited.sort((a, b) => pages.indexOf(Number(a.page_number)) - pages.indexOf(Number(b.page_number)));
      return [...cited, ...rest];
    }

    function sourcesHtml(sources) {
      if (!sources?.length) return '';
      let html = `<details class="mt-2 text-xs sources"><summary class="cursor-pointer text-zinc-400">Sources (${sources.length})</summary><div class="mt-2 space-y-2">`;
      sources.forEach((s, i) => {
        const pageUrl = s.document_id
          ? `${BACKEND}/documents/${s.document_id}/file#page=${s.page_number}`
          : '';
        const pageLabel = pageUrl
          ? `<a href="${pageUrl}" target="_blank" rel="noopener" class="text-indigo-300 hover:text-indigo-200 underline">Page ${s.page_number}</a>`
          : `<span class="text-indigo-300">Page ${s.page_number}</span>`;
        html += `<div class="bg-zinc-900/50 rounded-lg p-2"><span class="text-zinc-500">${i + 1}.</span> ${pageLabel}<div class="text-zinc-400 mt-1">${escapeHtml((s.content || '').slice(0,220))}…</div></div>`;
      });
      html += '</div></details>';
      return html;
    }

    function addMessage(role, content, meta) {
      hideEmpty();
      const div = document.createElement('div');
      div.className = role === 'user'
        ? 'msg-user border border-indigo-900/50 rounded-2xl px-4 py-3 max-w-2xl ml-auto'
        : 'bg-card border border-border rounded-2xl px-4 py-3 max-w-2xl';
      const body = role === 'assistant' ? renderMarkdown(content) : escapeHtml(content);
      let html = `<div class="text-sm msg-content">${body}</div>`;
      if (meta) {
        html += `<div class="text-[11px] text-zinc-500 mt-2 meta">${meta.latency_ms} ms · ${meta.token_count} tokens</div>`;
        html += sourcesHtml(meta.sources);
      }
      div.innerHTML = html;
      messagesEl.appendChild(div);
      stickToBottom(true);
      return div;
    }

    form.onsubmit = async (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;
      input.value = '';
      pinnedToBottom = true;
      const prior = history.slice(-6);
      history.push({ role: 'user', content: q });
      addMessage('user', q);
      const docId = document.getElementById('doc-select').value;
      const payload = { query: q, history: prior };
      if (docId) payload.document_id = parseInt(docId);

      const thinking = document.createElement('div');
      thinking.className = 'text-sm text-zinc-500 italic px-2';
      thinking.textContent = 'Thinking…';
      messagesEl.appendChild(thinking);
      stickToBottom(true);

      let assistantDiv = null;
      let contentEl = null;
      let fullText = '';
      let sources = [];

      try {
        const r = await fetch(BACKEND + '/query/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          thinking.remove();
          const detail = err.detail || 'Query failed';
          addMessage('assistant', detail);
          history.push({ role: 'assistant', content: detail });
          return;
        }

        const reader = r.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          const parts = buffer.split('\n\n');
          buffer = parts.pop() || '';

          for (const part of parts) {
            const line = part.trim();
            if (!line.startsWith('data: ')) continue;
            let evt;
            try { evt = JSON.parse(line.slice(6)); } catch { continue; }

            if (evt.type === 'sources') {
              sources = evt.sources || [];
            } else if (evt.type === 'token') {
              if (!assistantDiv) {
                thinking.remove();
                assistantDiv = addMessage('assistant', '');
                contentEl = assistantDiv.querySelector('.msg-content');
              }
              fullText += evt.content;
              contentEl.innerHTML = renderMarkdown(fullText);
              stickToBottom(false);
            } else if (evt.type === 'done') {
              if (!assistantDiv) {
                thinking.remove();
                assistantDiv = addMessage('assistant', fullText);
              }
              const ordered = prioritizeSources(sources, fullText);
              const meta = document.createElement('div');
              meta.className = 'text-[11px] text-zinc-500 mt-2';
              meta.textContent = `${evt.latency_ms} ms · ${evt.token_count} tokens`;
              assistantDiv.appendChild(meta);
              if (ordered.length) {
                assistantDiv.insertAdjacentHTML('beforeend', sourcesHtml(ordered));
              }
              history.push({ role: 'assistant', content: fullText });
              stickToBottom(false);
              loadStats();
            } else if (evt.type === 'error') {
              thinking.remove();
              const detail = evt.detail || 'Stream error';
              addMessage('assistant', detail);
              history.push({ role: 'assistant', content: detail });
            }
          }
        }

        if (thinking.parentNode) thinking.remove();
      } catch (err) {
        if (thinking.parentNode) thinking.remove();
        addMessage('assistant', 'Network error');
        history.push({ role: 'assistant', content: 'Network error' });
      }
    };

    loadDocs();
  </script>
</body>
</html>
