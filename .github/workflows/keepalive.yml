name: Keep backend warm

on:
  schedule:
    # Every 5 minutes. Stops Railway from sleeping the backend.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        env:
          BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
        run: |
          URL="${BACKEND_HEALTH_URL:-https://backend-production-4747.up.railway.app/health}"
          echo "Pinging $URL"
          curl -fsS --retry 3 --retry-delay 2 --max-time 30 "$URL"
          echo
          echo "OK"
