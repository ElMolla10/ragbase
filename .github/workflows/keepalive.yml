name: Keep backend warm

on:
  schedule:
    # Every 5 minutes. Stops Railway from sleeping the backend.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        env:
          # Override in repo secrets if the domain changes.
          BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL || 'https://backend-production-4747.up.railway.app/health' }}
        run: |
          echo "Pinging $BACKEND_HEALTH_URL"
          curl -fsS --retry 3 --retry-delay 2 --max-time 30 "$BACKEND_HEALTH_URL"
          echo
          echo "OK"
